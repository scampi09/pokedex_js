<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokemon game</title>
    <script src="script.js" type="module" defer></script>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="Pokedex" id="Pokedex">
        <div class="pokedexContainer">
            <img src="pokedexImg.png" alt="pokedex" class="pokedexImg" id="pokedexImg">
        </div>

        <div class="pokedexContainer">
            <input type="text" id="searchInput" class="searchInput">
            <button class="extraBtn">
            </button>
            <button class="extraBtn2">
            </button>
            <div class="pokedexPhoto" id="pokedexPhoto">
            </div>
            <i class="pokedexPokemonNaam" id="pokedexPokemonNaam">
            </div>
            <div class="pokedexPokemonNumber" id="pokedexPokemonNumber">
            </div>
            <div class="statsContainer" id="statsContainerUp">
                <div class="baseHealt" id="baseHealt">  
                </div>
                <div class="baseAttack" id="baseAttack"> 
                </div>
                <div class="baseDefense" id="baseDefense">
                </div>
            </div>
            <div class="statsContainer" id="statsContainerDown">
                <div class="specAttac" id="specAttac">
                </div>
                <div class="specDefence" id="specDefence">
                </div>
                <div class="baseSpeed" id="baseSpeed">
                </div>
            </div>
        </div>

        <div class="D-Pad">
            <div class="btn-col" id="ButtonTop"><button>top</button></div>
            <div class="btn-row">
            <button id="buttonLeft">left</button>
            <div class="center">optional center element</div>
                <button id="buttonRight">right</button>
            </div>
        <div class="btn-col" id="ButtonBottom"><button>bottom</button></div>
    </div>
    </div>
</body>
</html>
